# Keeps this repository's GitHub Actions pins current.
#
# The actions here are pinned so a moved upstream tag cannot silently change
# what runs. Pinning is right, but a pin does not move on its own, and nothing
# else bumps it: Dependabot's security updates cover advisories in application
# dependencies, not routine action versions. Without this file the pins simply
# rot. That is not hypothetical -- callers of the shared security workflow sat
# 7 to 9 weeks behind it until 2026-09-09, and the drift was only found by
# reading every pin by hand.
#
# Grouped so a week of bumps arrives as one review rather than several, and
# held for seven days so a freshly published version has time to be yanked
# before it lands here. Same shape as security-workflows/.github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Application dependencies. Security updates would arrive without these entries;
  # routine version updates do not, and without them every bump is an emergency.
  # Tauri's crate half and npm half move together or not at all.
  #
  # tools/check-tauri-version-sync.mjs requires tauri <-> @tauri-apps/api, and each
  # tauri-plugin-<x> <-> @tauri-apps/plugin-<x>, to resolve to the same major/minor,
  # because `tauri build` enforces that and our CI does not run it. Dependabot groups
  # live inside a single package-ecosystem, so no group can span cargo and npm: the
  # crate bump and the npm bump always arrive as two pull requests, and each one on its
  # own fails that check. Grouping cannot fix this and does not try to.
  #
  # What it fixes is blast radius. tauri-plugin-process 2.3.1 to 2.4.0 landed in the two
  # catch-all groups below and took 7 unrelated cargo updates and 11 unrelated npm
  # updates down with it: both group PRs sat red over that one pair. With tauri in its
  # own group the deadlock is confined to two small PRs that are plainly a pair, and
  # everything else still flows.
  #
  # When the pair appears: land one commit moving both sides, as #106 did, then rebase
  # the two tauri PRs. They drop the entry and go green.
  #
  # The tauri group is listed first on purpose. Dependabot puts a dependency in the
  # first group it matches, so the catch-alls below must not see these first.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo-minor-patch:
        update-types: ["minor", "patch"]
