name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Detect which parts of the tree changed so we only run the test suites that
  # can actually be affected. Docs / .gitignore / .claude-only changes skip both
  # test jobs; a JS-only change skips the (~6 min) Rust job, and vice versa.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            js:
              - 'src/**'
              - 'tests/**'
              - 'samples/**'
              - 'tools/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'svelte.config.*'
              - '.github/workflows/test.yml'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/test.yml'

  test:
    name: JS (typecheck + vitest)
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A high or critical advisory in the dependencies that ship fails the
      # PR. dependency-audit.yml is the companion check: it fails a PR that
      # ADDS an advisory at any scope, build-time ones included.
      #
      # Why --omit=dev. Without it this step also fails on advisories that no
      # version can clear. GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high) was
      # updated on 2026-11-17 to cover <= 4.0.7, which is picomatch's latest
      # release, so nothing satisfies it. It arrives as a devDependency under
      # vite's glob matcher, and npm reports that one advisory against 8
      # packages. The shipped tree reports nothing at any level, not merely
      # nothing at high, so this step is a real gate rather than a formality.
      #
      # Neither the `audit` job in security.yml, which is the weekly
      # repository-settings audit, nor src/audit/, which is this app's own
      # feature, has anything to do with this step.
      - name: Audit the dependencies that ship
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  rust:
    name: Rust (cargo test)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Tauri crate links against WebKitGTK/GTK, so its system dev
      # packages must be present for the lib to compile — even though the
      # unit tests only exercise pure parsing logic (no window/webview).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      # ubuntu-latest ships a stable Rust toolchain, so no toolchain action
      # is needed. Swatinem/rust-cache caches the registry + build artifacts
      # keyed on Cargo.lock so tauri doesn't recompile from scratch each run.
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # master
        with:
          workspaces: src-tauri
      - name: Run cargo test
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  # Tauri enforces npm-package == Rust-crate major/minor only inside
  # `tauri build` (which the jobs above don't run), so a plugin bumped on one
  # side slips through to release time — this caught v0.5.3 too late. This job
  # compares the resolved lockfile versions directly, so a mismatch fails the
  # PR. It only reads package-lock.json + Cargo.lock, so it needs no install
  # and always runs (unguarded by the changes filter).
  tauri-version-sync:
    name: Tauri crate/npm version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check Tauri plugin/core versions are in sync
        run: node tools/check-tauri-version-sync.mjs
