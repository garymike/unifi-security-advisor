name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-09-09
  gha-security:
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-09-09
  sast:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/sast.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-09-09
  iac-security:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: garymike/security-workflows/.github/workflows/iac-security.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-09-09
  codeql:
    # deep engine — run on PRs, main pushes, and the schedule (skip feature-branch pushes)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: garymike/security-workflows/.github/workflows/codeql.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-09-09
    with:
      languages: javascript-typescript,python

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@0fd7cac94dc5b04de3b85245614710cbe512893e # main @ 2026-09-09