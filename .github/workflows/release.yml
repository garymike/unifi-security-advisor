name: Release

on:
  push:
    tags: ['v*']

# The updater signing key is provided via secrets; see RELEASING.md. The build
# succeeds without them (producing an unsigned installer), but the in-app
# updater requires the signed artifacts, so set the secrets before relying on it.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows first (the maintainer's platform). Add macos-latest /
          # ubuntu-22.04 entries here later — ubuntu needs the same WebKitGTK
          # deps the test workflow's `rust` job installs.
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Pull this version's CHANGELOG section into the release body so the
      # in-app updater's "What's changed" shows real notes (not a generic line).
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node tools/changelog-section.mjs "${GITHUB_REF_NAME}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: UniFi Security Advisor ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Publish immediately (not a draft): a successful build goes live as
          # the "latest" release, so installed apps can auto-update to it with
          # no manual publish step. The tag push is the release gate.
          releaseDraft: false
          prerelease: false
          # Point the updater's generic windows-x86_64 entry at the NSIS
          # installer instead of the MSI (tauri defaults to MSI "for legacy
          # reasons"). NSIS does smooth per-user background updates; MSI
          # auto-updates are clunky and can trigger UAC / a full reinstall.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
