[package]
name = "app"
version = "0.5.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2"
# rustls with the ring provider, the same TLS stack tauri-plugin-updater
# already pulls in, so this drops native-tls/OpenSSL instead of adding a second
# stack. connection.rs needs rustls directly for its pinning verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# SHA-256 of a controller's certificate for pinning (pinning.rs). Already in
# the tree as rustls's provider; no new crate.
ring = "0.17.14"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
bson = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-opener = "2"
# Replaces tauri-plugin-sql (which let the page run any SQL against any path):
# the database is now owned by Rust with a fixed statement catalog (src/db.rs).
# Fewer crates than the plugin's sqlx stack; bundled so no system SQLite is needed.
rusqlite = { version = "0.42", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
